app:
  name: crawler-process
  debug: true
  process:
    news: 7200 # 2小時 (60s * 60m * 2h)
    ranking: 43200 # 12小時 (60s * 60m *12hr)
    picture: 1800 # 2小時 (60s * 30m)

aws:
  accessKey: YOUR_ACCESS_KEY
  secretKey: YOUR_SECRET_KEY
  region: REGION
  bucket: BUCKET
  acl: false

db:
  database: sport_news
  master:
    username: root
    password: 1234
    host: localhost
    port: 3306
  slave:
    username: root
    password: 1234
    host: localhost
    port: 3306
  dial_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  timezone: UTC
  conn_max_lifetime: 0s
  max_idle_conns: 2
  max_open_conns: 0
assets: http://assets.localhost
